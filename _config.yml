# Site settings
locale: "en-US"
site_theme: "default"
title: "Junteng Liu"
title_separator: "-"
name: &name "Junteng Liu"
description: &description "Junteng Liu is a first-year PhD candidate in the HKUST NLP Group researching natural language processing and machine learning."
url: https://harborveteran.github.io
baseurl: "/LJT-Homepage"
repository: "HarborVeteran/LJT-Homepage"

# Sidebar author information from memory
author:
  avatar:
  name: "Junteng Liu"
  pronouns:
  bio: "First-year PhD candidate at HKUST NLP Group researching natural language processing, machine learning, LLM reasoning, reinforcement learning, VLM hallucination, LLM truthfulness, and interpretability."
  location:
  employer: "HKUST NLP Group"
  uri:
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

# Publication categories used on /publications/
publication_category:
  arxiv:
    title: 'arXiv Papers'
  conferences:
    title: 'Conference Papers'

# Site settings
teaser:
breadcrumbs: false
words_per_minute: 160
future: false
read_more: "disabled"
talkmap_link: false

comments:
  provider: false

atom_feed:
  hide: true
  path:

# Social sharing and structured data
twitter:
  username: &twitter "junteng88716710"
facebook:
  username:
  app_id:
  publisher:
og_image: og-image.png
og_description: "First-year PhD candidate in the HKUST NLP Group researching NLP, machine learning, LLM reasoning, reinforcement learning, VLM hallucination, truthfulness, and interpretability."

social:
  type: Person
  name: "Junteng Liu"
  links:
    - mailto:jliugi@connect.ust.hk
    - https://github.com/Vicent0205
    - https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate
    - https://x.com/junteng88716710

# Analytics
analytics:
  provider: false
  google:
    tracking_id:

# File handling
include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor

keep_files:
  - .git
  - .svn

encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown rendering
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  header_links: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections: only publications are published as a dedicated collection.
collections:
  posts:
    output: false
  publications:
    output: true
    permalink: /:collection/:path/
  teaching:
    output: false
  portfolio:
    output: false
  talks:
    output: false

# Defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Outputting
permalink: /:categories/:title/
timezone: Etc/UTC

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archive paths
category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

# HTML compression
compress_html:
  clippings: all
  comments: ["<!-- ", " -->"]
  ignore:
    envs: development
